<body >
    <div class="container py-4">
        <h1 class="text-center mt-3">BMI Calculator</h1>
        <p class="text-center text-secondary mb-4">Understand your BMI and build healthier habits</p>
        <div class="row g-4">
            <div class="col-md-6">
                <div class="card border-1 shadow-sm rounded-4 h-100 ">
                    <div class="card-body p-4">
                        <h4 class="text-center mb-4">Calculate Your BMI</h4>

                   <div class="d-flex gap-3 mb-3">
                     <div class="w-50">
                        <label for="ht" class="form-label">Height(cm)</label>
                        <input id="ht" type="number" class="form-control mb-3" placeholder="Enter your height"></div>
                    <div class="w-50">
                        <label for="" class="form-label">Weight</label>
                    <input id="wt" type="number" class="form-control mb-3" placeholder="Enter your weight">
                    </div>
                   </div>

                    <div class="d-flex gap-3 mb-2">
                   <div class="w-50">
                     <label for="age" class="form-label">Age</label>
                    <input id="age" type="number" class="form-control" placeholder="Enter your age">
                   </div>
                   <div class="w-50">
                    <label for="" class="form-label d-block">Gender</label>
                    <input id="fm" type="radio" name="gender" >
                    <label for="fm" class="me-2">Female</label>
                    <input id="ml" type="radio" name="gender">
                    <label for="ml" >Male</label>
                   </div>
                    </div>
                    
                    <div class="d-flex gap-3">
                        <button type="button" class="btn btn-outline-primary text-center mt-5" onclick="calculate()">Calculate BMI</button>
                        <button type="reset" class="btn btn-outline-secondary text-center mt-5" onclick="reset()">Reset</button>
                        
                    </div>
                    </div>
                </div>

            </div>
            <div class="col-md-6">
                <div class="card border-1 shadow-sm rounded-4 h-100">
                    <div class="card-body p-4">
                        <h4 class="mb-3">Your Result</h4>
                        <div class="text-center ">
                            <p class="text-secondary mb-1">Your BMI</p>
                        <h1 id="result" class=" fw-semibold">--</h1>
                        <p id="categoryy" class="fw-semibold"></p>
                        </div>
                        <hr>
                        <div class="text-center">
                            <img width="250px" src="https://www.emeraldlaser.com/wp-content/uploads/2022/11/body-mass-index.jpg" alt="">
                        </div>
                    </div>
                </div>
                <!-- <img width="200px" src="https://www.emeraldlaser.com/wp-content/uploads/2022/11/body-mass-index.jpg" alt=""> -->
            </div>
        </div>
